<!DOCTYPE html>
<html lang="pt">
<head>
<meta name="robots" content="noindex,nofollow,noarchive">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>O Meu Mundo do Desporto</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #0b1020;
            color: white;
            line-height: 1.6;
            transition: 0.3s;
        }

        /* NAVBAR */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(11, 16, 32, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        nav .container {
            max-width: 1100px;
            margin: auto;
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #4ade80;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 25px;
        }

        nav a {
            color: white;
            text-decoration: none;
            transition: 0.3s;
        }

        nav a:hover {
            color: #4ade80;
        }

        #themeButton {
            border: none;
            background: #1f2937;
            color: white;
            padding: 9px 13px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
        }

        /* HERO */
        .hero {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 100px 20px 50px;
            background:
                radial-gradient(circle at top left, #14532d, transparent 35%),
                radial-gradient(circle at bottom right, #1e3a8a, transparent 35%),
                #0b1020;
        }

        .hero-content {
            max-width: 800px;
        }

        .hero .emoji {
            font-size: 75px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-15px);
            }
        }

        .hero h1 {
            font-size: clamp(40px, 7vw, 75px);
            margin: 15px 0;
        }

        .hero h1 span {
            color: #4ade80;
        }

        .hero p {
            font-size: 20px;
            color: #cbd5e1;
            margin-bottom: 30px;
        }

        .button {
            display: inline-block;
            padding: 14px 25px;
            background: #4ade80;
            color: #052e16;
            text-decoration: none;
            font-weight: bold;
            border-radius: 30px;
            transition: 0.3s;
            border: none;
            cursor: pointer;
        }

        .button:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 10px 30px rgba(74, 222, 128, 0.25);
        }

        /* SECTIONS */
        section {
            max-width: 1100px;
            margin: auto;
            padding: 90px 25px;
        }

        .section-title {
            text-align: center;
            margin-bottom: 45px;
        }

        .section-title h2 {
            font-size: 38px;
            margin-bottom: 10px;
        }

        .section-title p {
            color: #94a3b8;
        }

        /* CARDS */
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            padding: 30px 20px;
            border-radius: 20px;
            text-align: center;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: #4ade80;
            background: rgba(74,222,128,0.08);
        }

        .card .icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .card h3 {
            font-size: 23px;
            margin-bottom: 8px;
        }

        .card p {
            color: #94a3b8;
        }

        /* FAVORITES */
        .favorite {
            display: flex;
            align-items: center;
            gap: 20px;
            background: #111827;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 15px;
            transition: 0.3s;
        }

        .favorite:hover {
            transform: translateX(8px);
            background: #172033;
        }

        .favorite .number {
            font-size: 30px;
            font-weight: bold;
            color: #4ade80;
            min-width: 40px;
        }

        .favorite .sport-icon {
            font-size: 40px;
        }

        .favorite h3 {
            margin-bottom: 3px;
        }

        .favorite p {
            color: #94a3b8;
        }

        /* OPINION */
        .opinion {
            background: linear-gradient(135deg, #14532d, #1e3a8a);
            padding: 45px;
            border-radius: 25px;
            text-align: center;
        }

        .opinion h2 {
            font-size: 32px;
            margin-bottom: 15px;
        }

        #opinionText {
            font-size: 20px;
            color: #e2e8f0;
            min-height: 35px;
            margin-bottom: 25px;
        }

        /* STATS */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            text-align: center;
        }

        .stat {
            padding: 30px;
            background: #111827;
            border-radius: 18px;
        }

        .stat h3 {
            font-size: 42px;
            color: #4ade80;
        }

        .stat p {
            color: #94a3b8;
        }

        /* FOOTER */
        footer {
            text-align: center;
            padding: 35px 20px;
            background: #070b16;
            color: #64748b;
        }

        footer span {
            color: #4ade80;
        }

        /* LIGHT MODE */
        body.light {
            background: #f1f5f9;
            color: #0f172a;
        }

        body.light nav {
            background: rgba(255,255,255,0.9);
        }

        body.light nav a {
            color: #0f172a;
        }

        body.light .hero {
            background:
                radial-gradient(circle at top left, #bbf7d0, transparent 35%),
                radial-gradient(circle at bottom right, #bfdbfe, transparent 35%),
                #f1f5f9;
        }

        body.light .hero p,
        body.light .section-title p,
        body.light .card p,
        body.light .favorite p,
        body.light .stat p {
            color: #475569;
        }

        body.light .card,
        body.light .favorite,
        body.light .stat {
            background: white;
            border-color: #e2e8f0;
        }

        body.light footer {
            background: #e2e8f0;
        }

        /* MOBILE */
        @media (max-width: 700px) {
            nav ul {
                display: none;
            }

            .hero h1 {
                font-size: 45px;
            }

            .hero p {
                font-size: 17px;
            }

            section {
                padding: 70px 20px;
            }

            .opinion {
                padding: 30px 20px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <div class="container">
            <div class="logo">🏆 Meu Desporto</div>

            <ul>
                <li><a href="#desportos">Desportos</a></li>
                <li><a href="#favoritos">Favoritos</a></li>
                <li><a href="#ranking">Ranking</a></li>
            </ul>

            <button id="themeButton" onclick="changeTheme()">🌙</button>
        </div>
    </nav>

            <h1>
                O meu <span>mundo</span> do desporto
